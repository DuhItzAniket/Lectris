[project]
name = "lectris"
version = "0.1.0"
description = "OCR output, read back into clean, ordered text: every change it makes is recorded and explained."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["ocr", "post-processing", "hocr", "alto", "text-normalisation", "dehyphenation", "reading-order", "cer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DuhItzAniket/Lectris"
Repository = "https://github.com/DuhItzAniket/Lectris"
Issues = "https://github.com/DuhItzAniket/Lectris/issues"
Changelog = "https://github.com/DuhItzAniket/Lectris/blob/main/CHANGELOG.md"

[project.scripts]
lectris = "lectris.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "hypothesis>=6.170.1",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# The docstrings' examples are tests too.
testpaths = ["tests", "src"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--doctest-modules"]
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "PT",           # pytest style
    "C4",           # comprehensions
    "N",            # naming
    "S",            # bandit (security)
    "PERF",         # performance anti-patterns
    "TID",          # tidy imports
    "PTH",          # pathlib
    "T20",          # no print
    "ARG",          # unused arguments
    "RET",          # return style
    "PLC", "PLE", "PLR", "PLW",  # pylint subsets
    "ERA",          # commented-out code
    "BLE",          # blind except
]
ignore = [
    "PLR0913",  # keyword-only options read better than bundled option objects
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
files = ["src", "tests"]
