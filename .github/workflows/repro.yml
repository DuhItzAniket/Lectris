# Repro (https://github.com/DuhItzAniket/Repro) reproduces every pull request on its base and
# its head, compares what each side does, and posts a Reproduction Card: VERIFIED, FLAGGED or
# UNVERIFIABLE. With the repository secret ANTHROPIC_API_KEY set, Claude reviewers also judge
# the pull request's claims against that evidence; without it, the checks are deterministic.
name: Repro

on: pull_request

permissions:
  contents: read
  checks: write # the check run
  pull-requests: write # the comment
  id-token: write # signing the card
  attestations: write
  artifact-metadata: write

concurrency:
  group: repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    name: Repro
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: DuhItzAniket/Repro@a474ff87a5bc5b959e6e05e9676e766fe5968028 # v1.6.0
        with:
          agents: ${{ secrets.ANTHROPIC_API_KEY != '' && 'claude' || 'off' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPRO_AGENT_MODEL: claude-haiku-5-5
